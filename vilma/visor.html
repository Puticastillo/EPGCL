    // --- Grid Calculations ---
    function calculatePerfectGridSize() {
        if (state.viewMode !== 'cards') return;
        const grid = document.getElementById('grid');
        if (!grid || grid.offsetWidth === 0) return;
        const colsStr = window.getComputedStyle(grid).gridTemplateColumns;
        let cols = 1; 
        if (colsStr && colsStr !== 'none') cols = colsStr.split(' ').length;
        
        let rows = Math.round(12 / cols);
        if (rows < 2) rows = 2; 
        if (cols === 1) rows = 8; 
        
        let perfectCount = cols * rows;
        const validChannelsCount = state.allChannels.filter(ch => state.visibleIds.has(ch.id) && (!ch.isAdult || state.showAdult)).length;
        if (validChannelsCount < perfectCount) {
             let maxPossibleRows = Math.floor(validChannelsCount / cols);
             perfectCount = maxPossibleRows * cols;
             if(perfectCount === 0) perfectCount = validChannelsCount; 
        }
        if (state.targetCardCount !== perfectCount) {
            state.targetCardCount = perfectCount;
            refreshRandomCards();
            renderGrid();
        }
    }

    function refreshRandomCards() {
        const fixedIds = ['0104', '0105', '0106', '0107', '0401'];
        const poolIds = ['0102', '0103', '0108', '0109', '0110', '0111', '0112', '0113', '0114', '0115', '0117', '0121', '0153', '0201', '0202', '0203', '0207', '0208', '0214', '0301', '0313', '0314'];
        const validIds = new Set(state.allChannels.filter(ch => state.visibleIds.has(ch.id) && (!ch.isAdult || state.showAdult)).map(ch => ch.id));

        const availableFixed = fixedIds.filter(id => validIds.has(id));
        const availablePool = poolIds.filter(id => validIds.has(id));

        const count = state.targetCardCount || 12;
        let finalIds = [...availableFixed];
        const slotsLeft = count - finalIds.length;
        
        if (slotsLeft > 0) {
            const shuffledPool = [...availablePool].sort(() => 0.5 - Math.random());
            finalIds = finalIds.concat(shuffledPool.slice(0, slotsLeft));
        } else {
            finalIds = finalIds.slice(0, count);
        }
        state.displayedRandomIds = finalIds;
    }

    // --- 2. RENDER GRID (Inicio) ---
    function renderGrid() {
        const grid = document.getElementById('grid'); 
        grid.innerHTML = '';
        const now = new Date();
        
        let mapped = state.allChannels.map(ch => {
            ch.current = ch.programs.find(p => p.start <= now && p.stop > now) || ch.programs.find(p => p.start > now);
            let displayProg = ch.current; 
            return { ch, displayProg };
        });

        let filtered = mapped.filter(item => {
            if(!state.visibleIds.has(item.ch.id)) return false;
            if(!state.showAdult && item.ch.isAdult) return false;
            if(!item.displayProg) return false; 
            if(state.displayedRandomIds.length > 0) return state.displayedRandomIds.includes(item.ch.id);
            return true;
        });

        if(state.sort === 'az') filtered.sort((a,b) => a.ch.name.localeCompare(b.ch.name));
        else {
            filtered.sort((a,b) => {
                const idxA = state.displayedRandomIds.indexOf(a.ch.id);
                const idxB = state.displayedRandomIds.indexOf(b.ch.id);
                if(idxA !== -1 && idxB !== -1) return idxA - idxB;
                return compareYXXX(a.ch, b.ch); 
            });
        }

        if(filtered.length === 0) { 
            grid.innerHTML = '<div id="loading">Sin resultados</div>'; 
            return; 
        }

        filtered.forEach(item => {
            const ch = item.ch; 
            const displayProg = item.displayProg;
            const isLive = (displayProg === ch.current && displayProg.start <= now && displayProg.stop > now);
            const imgUrl = getValidImg(displayProg.icon || ch.icon); 
            
            const card = document.createElement('div'); 
            card.className = 'card';
            card.onclick = () => { switchView('directory'); selectDirChannel(ch.id); }; 
            
            let progressWidth = 0;
            if(isLive) { 
                const total = displayProg.stop - displayProg.start; 
                const elapsed = now - displayProg.start; 
                if(total > 0) progressWidth = Math.min(100, Math.max(0, (elapsed/total)*100)); 
            }
            let badgeHTML = '';
            
            const bgStyle = imgUrl !== EMPTY_IMG ? `background-image: url('${imgUrl}'), url('${EMPTY_IMG}');` : `background-image: url('${EMPTY_IMG}');`;
            const safeLogo = getValidImg(ch.icon);
            
            card.innerHTML = `
                <div class="card-bg" style="${bgStyle}"></div>
                <div class="card-overlay">
                    <div class="card-title">${displayProg.title}</div>
                    <div class="card-meta">
                        <span>${formatTime(displayProg.start)} - ${formatTime(displayProg.stop)}</span>
                    </div>
                </div>
                ${safeLogo !== EMPTY_IMG ? `<img src="${safeLogo}" class="card-ch-logo" loading="lazy" onerror="this.src='${EMPTY_IMG}'">` : ''}
                ${badgeHTML}
                ${isLive ? `<div class="card-progress-container"><div class="card-progress-bar" style="width:${progressWidth}%"></div></div>` : ''}
            `;
            grid.appendChild(card);
        });
    }

    // Select date tabs in Directory
    function renderDirDateTabs(ch) {
        const tabsContainer = document.getElementById('dirDateTabs');
        tabsContainer.innerHTML = '';
        
        if (!ch || !ch.programs || ch.programs.length === 0) {
            tabsContainer.style.display = 'none';
            return;
        }
        tabsContainer.style.display = 'flex';

        const now = new Date();
        const todayTv = getTvDayStart(now);
        const offsets = new Set();
        
        ch.programs.forEach(p => {
            const progTv = getTvDayStart(p.start);
            const diffTime = progTv - todayTv;
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
            if(diffDays >= 0 && diffDays <= 14) offsets.add(diffDays); 
        });
        
        const sortedOffsets = Array.from(offsets).sort((a,b) => a - b);
        
        if (sortedOffsets.includes(0)) {
            const btn = document.createElement('button');
            btn.className = `ch-date-tab ${dirState.dateOffset === 0 ? 'active' : ''}`;
            btn.innerText = 'HOY';
            btn.onclick = () => { setDirDate(0); };
            tabsContainer.appendChild(btn);
        }
        
        if (sortedOffsets.includes(1)) {
            const btn = document.createElement('button');
            btn.className = `ch-date-tab ${dirState.dateOffset === 1 ? 'active' : ''}`;
            btn.innerText = 'MAÑANA';
            btn.onclick = () => { setDirDate(1); };
            tabsContainer.appendChild(btn);
        }
        
        const moreOffsets = sortedOffsets.filter(o => o > 1);
        if (moreOffsets.length > 0) {
            const select = document.createElement('select');
            select.className = `ch-date-tab ch-date-select ${dirState.dateOffset > 1 ? 'active' : ''}`;
            
            const defaultOpt = document.createElement('option');
            defaultOpt.value = "";
            defaultOpt.innerText = "MÁS DÍAS";
            defaultOpt.disabled = true;
            if (dirState.dateOffset <= 1) defaultOpt.selected = true;
            defaultOpt.style.display = 'none'; 
            select.appendChild(defaultOpt);
            
            moreOffsets.forEach(offset => {
                const opt = document.createElement('option');
                opt.value = offset;
                
                const d = new Date(todayTv);
                d.setDate(d.getDate() + offset);
                let dateStr = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric' });
                dateStr = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
                
                opt.innerText = dateStr;
                if (dirState.dateOffset === offset) opt.selected = true;
                select.appendChild(opt);
            });
            
            select.onchange = (e) => { setDirDate(parseInt(e.target.value)); };
            tabsContainer.appendChild(select);
        }
    }

    function setDirDate(offset) {
        dirState.dateOffset = offset;
        const ch = state.allChannels.find(c => c.id === dirState.selectedChannelId);
        if(ch) renderDirDateTabs(ch); 
        renderDirSchedule();
    }

    function togglePastPrograms(btn) {
        const wrapper = document.getElementById('pastProgramsWrapper');
        if (wrapper.style.display === 'none') {
            wrapper.style.display = 'flex';
            btn.innerText = 'Ocultar programas anteriores';
        } else {
            wrapper.style.display = 'none';
            btn.innerText = 'Ver programas anteriores';
        }
    }

    // --- RENDER DIRECTORIO SIMPLIFICADO (Sólo Hora y Título) ---
    function renderDirSchedule(isAutoRefresh = false) {
        const list = document.getElementById('dirProgList');
        list.innerHTML = '';
        
        if(!dirState.selectedChannelId) return;
        const ch = state.allChannels.find(c => c.id === dirState.selectedChannelId);
        if(!ch) return;

        const now = new Date();
        const baseTvDay = getTvDayStart(now);
        baseTvDay.setDate(baseTvDay.getDate() + dirState.dateOffset);
        
        const startOfDay = new Date(baseTvDay);
        const endOfDay = new Date(baseTvDay);
        endOfDay.setDate(endOfDay.getDate() + 1);
        endOfDay.setMilliseconds(-1);

        const dayProgs = ch.programs.filter(p => (p.stop > startOfDay && p.start < endOfDay));

        if(dayProgs.length === 0) {
            list.innerHTML = '<div style="color:var(--text-dim); padding: 15px;">No hay programación disponible para este día.</div>';
            return;
        }

        let hasPast = false;
        const pastCards = [];
        const futureCards = [];
        
        dayProgs.forEach(p => {
            const isLive = p.start <= now && p.stop > now;
            const isPast = p.stop <= now;
            
            let classes = 'ch-prog-card-simple';
            if(isLive) classes += ' is-live';
            else if(isPast) classes += ' is-past';

            const card = document.createElement('div');
            card.className = classes;
            card.innerHTML = `
                <div class="ch-prog-time-simple">${formatTime(p.start)}</div>
                <div class="ch-prog-title-simple">${isLive ? '<span class="live-dot" style="display:inline-block; width:8px; height:8px; background:var(--accent); border-radius:50%; margin-right:8px; box-shadow:0 0 8px var(--accent);"></span>' : ''}${p.title}</div>
            `;
            
            card.addEventListener('click', () => openDetail(p, ch));

            if (isPast && dirState.dateOffset === 0) { 
                hasPast = true;
                pastCards.push(card);
            } else {
                futureCards.push(card);
            }
        });

        if (hasPast && dirState.dateOffset === 0) {
            const btnWrap = document.createElement('div');
            btnWrap.style = "text-align: center; margin-bottom: 15px;";
            btnWrap.innerHTML = `<button class="btn-toggle-past" onclick="togglePastPrograms(this)">Ver programas anteriores</button>`;
            list.appendChild(btnWrap);
            
            const pastWrap = document.createElement('div');
            pastWrap.id = 'pastProgramsWrapper';
            pastWrap.style = "display:none; flex-direction:column; gap:8px; margin-bottom:8px;";
            pastCards.forEach(c => pastWrap.appendChild(c));
            list.appendChild(pastWrap);
        }

        futureCards.forEach(c => list.appendChild(c));

        setTimeout(() => {
            if(!isAutoRefresh) {
                const liveItem = list.querySelector('.is-live');
                if(liveItem && dirState.dateOffset === 0) {
                    liveItem.scrollIntoView({behavior: 'smooth', block: 'center'});
                }
            }
        }, 80);
    }

    // --- 4. RENDER SEARCH (Canales & Programas Restaurado Completo) ---
    function triggerSearch(e) {
        state.search = e.target.value;
        if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => {
            renderSearch();
        }, 150);
    }

    function renderSearch() {
        const term = state.search.trim();
        if (!term) {
            document.getElementById('searchResults').innerHTML = '<div style="color:var(--text-dim); text-align:center; padding: 40px;">Escribe para buscar canales o programas...</div>';
            return;
        }

        const sClean = cleanStr(term);
        const searchWords = sClean.split(" ").filter(w => w !== "");

        const matchedChannels = [];
        const matchedPrograms = [];
        const now = new Date();

        state.allChannels.forEach(ch => {
            if (ch.isAdult && !state.showAdult) return;
            if (!state.visibleIds.has(ch.id)) return;
            
            if (fuzzyMatchPreCleaned(ch.cleanName, searchWords)) {
                matchedChannels.push(ch);
            }

            ch.programs.forEach(p => {
                if (fuzzyMatchPreCleaned(p.cleanTitle, searchWords) || 
                    fuzzyMatchPreCleaned(p.cleanDesc, searchWords)) {
                    matchedPrograms.push({ ch, prog: p });
                }
            });
        });

        matchedPrograms.sort((a, b) => {
            const isPastA = a.prog.stop <= now;
            const isPastB = b.prog.stop <= now;
            if (isPastA && !isPastB) return 1;  
            if (!isPastA && isPastB) return -1; 
            return a.prog.start - b.prog.start;
        });

        if (matchedChannels.length === 0 && matchedPrograms.length === 0) {
            document.getElementById('searchResults').innerHTML = '<div style="color:var(--text-dim); text-align:center; padding: 40px;">No se encontraron resultados para "'+term+'".</div>';
            return;
        }

        // Setup layouts
        const searchResultsDiv = document.getElementById('searchResults');
        searchResultsDiv.innerHTML = '';
        
        if (matchedChannels.length > 0) {
            const title = document.createElement('h3');
            title.className = 'search-section-title';
            title.innerText = 'Canales Encontrados';
            searchResultsDiv.appendChild(title);
            
            const grid = document.createElement('div');
            grid.className = 'search-channels-grid';
            matchedChannels.forEach(ch => {
                const el = document.createElement('div');
                el.className = 'search-channel-item';
                const safeLogo = getValidImg(ch.icon);
                el.innerHTML = `<img src="${safeLogo}" loading="lazy" onerror="this.src='${EMPTY_IMG}'" title="${ch.name}">`;
                el.onclick = () => { switchView('directory'); selectDirChannel(ch.id); };
                grid.appendChild(el);
            });
            searchResultsDiv.appendChild(grid);
        }

        if (matchedPrograms.length > 0) {
            const title = document.createElement('h3');
            title.className = 'search-section-title';
            title.innerText = 'Programas Encontrados';
            searchResultsDiv.appendChild(title);
            
            const listContainer = document.createElement('div');
            listContainer.id = 'searchProgramsListContainer';
            listContainer.className = 'search-programs-list';
            searchResultsDiv.appendChild(listContainer);
            
            const limitProgs = matchedPrograms.slice(0, 50); 
            
            const renderSearchItem = (item) => {
                const ch = item.ch;
                const p = item.prog;
                const isLive = p.start <= now && p.stop > now;
                const isPast = p.stop <= now;
                
                const card = document.createElement('div');
                let classes = 'ch-prog-card search-result-card';
                if(isLive) classes += ' is-live';
                else if(isPast) classes += ' is-past';
                card.className = classes;

                const imgUrl = getValidImg(p.icon);
                const safeLogo = getValidImg(ch.icon);
                const searchDateStr = getSearchDateString(p, ch.name);
                
                let badgeHtml = '';
                if(isLive) {
                    badgeHtml = `<span class="list-prog-badge live" style="margin-right:8px; display:inline-block; vertical-align:middle;">Al Aire</span>`;
                } else if (isPast) {
                    badgeHtml = `<span class="list-prog-badge next" style="margin-right:8px; display:inline-block; vertical-align:middle; background:rgba(255,255,255,0.03);">Finalizado</span>`;
                }

                card.innerHTML = `
                    <div class="search-ch-logo-box">
                        <img src="${safeLogo}" onerror="this.src='${EMPTY_IMG}'">
                    </div>
                    <div class="ch-prog-info">
                        <div class="ch-prog-title" style="margin-bottom: 4px; font-weight:700;">
                            ${badgeHtml}${p.title}
                        </div>
                        <div class="search-prog-meta">${searchDateStr}</div>
                    </div>
                `;
                
                card.addEventListener('click', () => openDetail(p, ch));
                return card;
            };
            
            renderProgressive('searchProgramsListContainer', limitProgs, renderSearchItem, 10);
        }
    }

    function togglePosterVisibility() {
        const showPosters = document.getElementById('posterToggleCheck').checked;
        localStorage.setItem('show_posters', showPosters);
        document.getElementById('grid').classList.toggle('hide-posters', !showPosters);
    }

    // --- Hero Slider Logic (Siempre Disponible) ---
    function initHero() {
        const candidates = state.allChannels.filter(ch => {
            const hasProg = ch.current && (ch.current.icon || ch.icon);
            return hasProg && !ch.isAdult;
        });
        if(heroState.list.length === 0) { 
            heroState.list = candidates.sort(() => 0.5 - Math.random()); 
            heroState.currentIndex = 0; 
        }
        if (heroState.list.length > 0 && state.search.trim() === '') {
            document.getElementById('heroSection').style.display = 'block';
            if(!heroState.interval) { 
                showHeroSlide(); 
                startHeroTimer(); 
            }
        } else { 
            document.getElementById('heroSection').style.display = 'none'; 
        }
    }

    function showHeroSlide() {
        const contentEl = document.getElementById('heroContent'); 
        const bgEl = document.getElementById('heroBg');
        contentEl.classList.add('changing'); 
        bgEl.classList.add('fade-out');
        
        setTimeout(() => {
            if(heroState.list.length === 0) return;
            const item = heroState.list[heroState.currentIndex]; 
            const prog = item.current;
            if(!prog) { 
                nextHero(); 
                return; 
            } 
            
            contentEl.onclick = () => {
                switchView('directory');
                selectDirChannel(item.id);
            };

            const bgImg = getValidImg(prog.icon || item.icon);
            bgEl.style.backgroundImage = `url('${bgImg}')`;
            document.getElementById('heroTitle').textContent = prog.title;
            document.getElementById('heroDesc').textContent = formatDesc(prog.desc);
            document.getElementById('heroLogo').src = getValidImg(item.icon);
            document.getElementById('heroChName').innerHTML = item.name;
            bgEl.classList.remove('fade-out'); 
            contentEl.classList.remove('changing');
            resetProgressBar();
        }, 400);
    }

    function resetProgressBar() { 
        const bar = document.getElementById('heroProgress'); 
        bar.style.transition = 'none'; 
        bar.style.width = '0%'; 
        if(heroState.isPlaying) { 
            setTimeout(() => { 
                bar.style.transition = `width ${heroState.duration}ms linear`; 
                bar.style.width = '100%'; 
            }, 50); 
        } 
    }

    function startHeroTimer() { 
        clearInterval(heroState.interval); 
        if(heroState.isPlaying) { 
            heroState.interval = setInterval(nextHero, heroState.duration); 
            resetProgressBar(); 
        } 
    }

    function nextHero() { 
        if (heroState.list.length === 0) return;
        heroState.currentIndex = (heroState.currentIndex + 1) % heroState.list.length; 
        showHeroSlide(); 
    }

    function prevHero() { 
        if (heroState.list.length === 0) return;
        heroState.currentIndex = (heroState.currentIndex - 1 + heroState.list.length) % heroState.list.length; 
        showHeroSlide(); 
        startHeroTimer(); 
    }

    function toggleHeroPlay() { 
        heroState.isPlaying = !heroState.isPlaying; 
        const btn = document.getElementById('heroPlayBtn'); 
        if(heroState.isPlaying) { 
            btn.innerHTML = '&#10074;&#10074;'; 
            startHeroTimer(); 
        } else { 
            btn.innerHTML = '&#9658;'; 
            clearInterval(heroState.interval); 
            document.getElementById('heroProgress').style.width = '0%'; 
        } 
    }
    
    // --- Modals Control ---
    function openDetail(prog, ch = null) {
        const modal = document.getElementById('detailModal'); 
        const img = document.getElementById('d-img'); 
        const logo = document.getElementById('d-logo');
        
        const titleObj = processTitle(prog.title);
        const cleanDesc = formatDesc(prog.desc);
        
        img.src = getValidImg(prog.icon);
        const safeLogo = ch ? getValidImg(ch.icon) : EMPTY_IMG;
        if(safeLogo !== EMPTY_IMG) { 
            logo.src = safeLogo; 
            logo.style.display = 'block'; 
        } else { 
            logo.style.display = 'none'; 
        }

        document.getElementById('d-title').innerText = titleObj.main; 
        document.getElementById('d-extra').innerText = titleObj.extra; 
        document.getElementById('d-desc').innerText = cleanDesc; 
        document.getElementById('d-time').innerHTML = `${getRelativeDate(prog.start)} | ${formatTime(prog.start)} - ${formatTime(prog.stop)}`;
        modal.style.display = 'flex';
    }

    function toggleAdults() { 
        state.showAdult = document.getElementById('adultCheck').checked; 
        calculatePerfectGridSize();
        renderCurrentView(); 
    }

    // Toggle sort order
    function setSort(s) { 
        state.sort = s; 
        document.getElementById('sortOriginal').classList.toggle('active', s === 'original');
        document.getElementById('sortAZ').classList.toggle('active', s === 'az');
        renderCurrentView(); 
    }

    function closeModal(e, id){ 
        if(e.target.id === id) closeDirect(id); 
    }

    function closeDirect(id){ 
        document.getElementById(id).style.display = 'none'; 
    }

    // --- Configuration Panel ---
    function toggleConfig() { 
        const p = document.getElementById('configPanel'); 
        p.style.display = p.style.display === 'block' ? 'none' : 'block'; 
        document.getElementById('urlConfigSection').style.display = 'none'; 
    }

    function toggleUrlSection() {
        const sec = document.getElementById('urlConfigSection');
        sec.style.display = sec.style.display === 'none' ? 'flex' : 'none';
    }

    // Global loading mask
    function showLoader(txt = "Cargando...") { 
        document.getElementById('loaderText').innerText = txt;
        document.getElementById('globalLoader').style.display = 'flex'; 
    }

    function hideLoader() { 
        document.getElementById('loaderText').innerText = "Actualizando Guía...";
        document.getElementById('globalLoader').style.display = 'none'; 
    }

    function manualLoadEPG() {
        const urlRaw = document.getElementById('urlInput').value.trim();
        if(!urlRaw) return;
        localStorage.setItem('epg_url', urlRaw); 
        toggleConfig();
        showLoader("Descargando guía...");
        fetchNewEPG(urlRaw);
    }

    function loadDefaultEPG() {
        document.getElementById('urlInput').value = DEFAULT_EPG_URL;
        localStorage.setItem('epg_url', DEFAULT_EPG_URL);
        toggleConfig();
        showLoader("Restaurando guía base...");
        fetchNewEPG(DEFAULT_EPG_URL);
    }

    // --- Initial Event Listeners ---
    document.addEventListener('DOMContentLoaded', () => {
        // Load settings
        const savedUrl = localStorage.getItem('epg_url');
        document.getElementById('urlInput').value = savedUrl || DEFAULT_EPG_URL;
        
        // Show/hide grid card backdrop posters from settings
        const showPosters = localStorage.getItem('show_posters') !== 'false';
        document.getElementById('posterToggleCheck').checked = showPosters;
        document.getElementById('grid').classList.toggle('hide-posters', !showPosters);
        
        loadEPG();
        
        // Setup background auto-refresh every 60s
        setInterval(() => { 
            if(!state.search) {
                const container = document.getElementById('mainContainer');
                const mainScrollPos = container.scrollTop;
                
                let dirScrollPos = 0;
                if(state.viewMode === 'directory') {
                    const dirScroll = document.getElementById('dirGridScroll');
                    if(dirScroll) dirScrollPos = dirScroll.scrollTop;
                }
                
                renderCurrentView(true); 
                
                setTimeout(() => { 
                    container.scrollTop = mainScrollPos; 
                    if(state.viewMode === 'directory') {
                        const dirScroll = document.getElementById('dirGridScroll');
                        if(dirScroll) dirScroll.scrollTop = dirScrollPos;
                    }
                }, 10); 
            }
        }, 60000);

        // Fetch EPG updates from server in background every 6 hours
        setInterval(() => { 
            const savedUrl = localStorage.getItem('epg_url') || DEFAULT_EPG_URL;
            fetchNewEPG(savedUrl);
        }, 21600000);
        
        // Listeners for searches
        document.getElementById('mainSearchInput').addEventListener('input', triggerSearch);
        document.getElementById('dirSearchInput').addEventListener('input', (e) => {
            dirState.search = e.target.value; 
            renderDirGrid();
        });
        document.getElementById('dirSearchInputActive').addEventListener('input', (e) => {
            dirState.searchActive = e.target.value; 
            renderDirGridActive();
        });
        document.getElementById('listSearchInput').addEventListener('input', (e) => {
            state.listSearch = e.target.value; 
            renderList();
        });

        // Resize handler to optimize grid cards count dynamically
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (state.viewMode === 'cards') calculatePerfectGridSize();
            }, 250); 
        });
    });
</script>
</body>
